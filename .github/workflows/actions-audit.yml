name: actions-audit

# Org-wide actions-conformance audit (scripts/audit/actions.ts).
# Measures every repo's workflows against:
#   R1a floating-branch ref to an org reusable workflow (hard tamper risk)
#   R1b tag ref to an org reusable workflow (mutable; prefer SHA)
#   R3  external action not SHA-pinned (org sha_pinning)
#   R2  third-party actions outside the canonical reusable-workflow set (sprawl)
# BLOCKING on the two hard, objective rules (--strict fails on R1a + R3); R1b and R2
# stay informational in the log. Baseline reached zero R1a+R3 (2026-07-08): the
# notify-front-desk @main refs were retired and the last unpinned externals SHA-pinned.
# Reads public repos with the default token.
on:
  schedule:
    - cron: "23 6 * * *" # daily, after the conformance-gate audit
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/audit/actions.ts
      - .github/workflows/actions-audit.yml
      - deno.json

permissions:
  contents: read

concurrency:
  group: actions-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: actions-conformance audit (blocking on R1a + R3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: deno task audit:actions:strict
