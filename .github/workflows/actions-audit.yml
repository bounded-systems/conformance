name: actions-audit

# Org-wide, REPORT-ONLY actions-conformance audit (scripts/audit/actions.ts).
# Measures every repo's workflows against:
#   R1a floating-branch ref to an org reusable workflow (hard tamper risk)
#   R1b tag ref to an org reusable workflow (mutable; prefer SHA)
#   R3  external action not SHA-pinned (org sha_pinning)
#   R2  third-party actions outside the canonical reusable-workflow set (sprawl)
# Exits 0 today (baseline the current state). Promote to a hard gate by switching
# `deno task audit:actions` → `audit:actions:strict` (fails on R1a + R3) once the
# floating-branch refs are cleaned up. Reads public repos with the default token.
on:
  schedule:
    - cron: "23 6 * * *" # daily, after the conformance-gate audit
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/audit/actions.ts
      - .github/workflows/actions-audit.yml
      - deno.json

permissions:
  contents: read

concurrency:
  group: actions-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x
      - name: actions-conformance audit (report-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: deno task audit:actions
