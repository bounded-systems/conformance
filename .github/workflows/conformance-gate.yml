name: conformance-gate

# Cross-repo drift gate — conformance's first workflow. FAILS a PR (and the daily
# audit) when @bounded-systems/guest-room's declared contract or exported surface
# drifts from what conformance records. Two read-only checks (scripts/gate/),
# both delegated to the shared @bounded-systems/drift-gate engine:
#   descriptor — trellis.json proof claims vs the pins in guest-room's README
#   surface    — mod.ts's exported surface (ts-morph) vs the checked-in golden
#
# Token posture: reads PUBLIC guest-room source via checkout, so it needs only
# `contents: read` — NO org-admin App token (contrast scripts/audit.mjs, which
# needs one for `gh api .../rulesets`).
#
# Deno runs the org-standard `v2.x`: the surface projection is now produced by
# ts-morph (pinned via drift-gate's typescript dependency, recorded in the
# golden's `_generated.typescript`), so it no longer depends on the deno version
# the way the old `deno doc --json` diff did.

on:
  pull_request:
  schedule:
    - cron: "17 6 * * *" # daily cross-repo drift audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout conformance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout guest-room (default-branch HEAD)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bounded-systems/guest-room
          path: _guest-room
          persist-credentials: false
          # No `ref:` → tracks guest-room's default-branch HEAD, so the daily
          # audit catches drift the moment guest-room merges it. To decouple a
          # conformance PR's status from guest-room's mutable HEAD, pin a `ref:`
          # (e.g. gate.config.json's rev) here and keep HEAD-tracking on schedule.
      - name: Setup Deno (org-standard v2.x)
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Run the gate (descriptor + surface)
        # Resolves _guest-room via gate.config.json localPath; exits non-zero on drift.
        run: deno task gate
