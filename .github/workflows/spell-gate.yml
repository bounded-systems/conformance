name: spell-gate

# Fail the build on any token not in the English/software dictionaries or the
# `words` allowlist in cspell.json. Catches nonsense / promotional insertions
# proactively (a smuggled product name is not a word). Adding a term to the
# allowlist is a reviewed diff — that is the gate. Dogfooded here; intended to
# move into repo-standard.yml for org-wide coverage.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bunx --bun cspell@8 lint --no-progress "**/*.{md,ts,sh,mjs,json,yml}"
