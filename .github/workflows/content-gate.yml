name: content-gate

# Fail the build if source contains disallowed content (promotional / third-party
# branding insertions). Reactive denylist in content-policy.json.
# Dogfooded here; intended to move into repo-standard.yml for org-wide coverage.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
      - run: bash scripts/content-gate.sh
